name: Android CI

on:
  pull_request :
    branches : [ main, develop ]
  push :
    branches :
      - main
      - develop
      - release/*

permissions:
  contents: read

jobs:
  test-feature:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
      - name: Lint
        run: ./gradlew lintDebug

  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      # /dev/kvm is root:kvm 0660 on ubuntu-latest and the runner user isn't in the
      # kvm group, so hardware virt for the Android emulator is otherwise unreachable.
      # Recipe from reactivecircus/android-emulator-runner README.
      - name: Grant runner access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          script: ./gradlew :androidApp:connectedDebugAndroidTest
