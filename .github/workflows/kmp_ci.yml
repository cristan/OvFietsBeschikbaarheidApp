name: CI

on:
  pull_request :
    branches : [ main, develop ]
  push :
    branches :
      - main
      - develop
      - release/*

permissions:
  contents: read

jobs:
  test-feature:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Run Unit Tests
        run: ./gradlew testAndroidHostTest
      - name: Lint
        run: ./gradlew lintDebug

  android-instrumented-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      # /dev/kvm is root:kvm 0660 on ubuntu-latest and the runner user isn't in the
      # kvm group, so hardware virt for the Android emulator is otherwise unreachable.
      # Recipe from reactivecircus/android-emulator-runner README.
      - name: Grant runner access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36

      # If no AVD cache hit, boot the emulator once with a no-op script so the
      # snapshot gets saved for subsequent runs.
      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot ready"

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :androidApp:connectedDebugAndroidTest

  ios-test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6
      # simctl returns right away and the simulator keeps booting
      # we do this to not have to wait on emulator boot later
      - name: Boot iOS simulator
        run: |
          SIMULATOR_UDID=$(xcrun simctl list devices available | grep -E '^\s+iPhone 17 \(' | tail -1 | grep -oE '[0-9A-F-]{36}')
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID"
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Kotlin/Native cache
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Run iOS unit tests
        run: ./gradlew :composeApp:iosSimulatorArm64Test
      - name: Run iOS UI tests
        run: xcodebuild test -project iosApp/iosApp.xcodeproj -scheme iosApp -destination "id=$SIMULATOR_UDID"
