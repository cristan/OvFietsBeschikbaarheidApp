<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OV-fiets Beschikbaarheid social preview</title>
<link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;600;700" rel="stylesheet">
<style>
  * {
    margin: 0;
    box-sizing: border-box;
  }

  body {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: #FFEB3B;
    color: #0D47A1;
    font-family: "Signika", sans-serif;
  }

  .intro {
    position: absolute;
    left: 96px;
    top: 80px;
    bottom: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .icon {
    width: 112px;
    height: 112px;
    border-radius: 25px;
    box-shadow: 0 2px 4px rgba(13, 71, 161, 0.25), 0 12px 28px rgba(13, 71, 161, 0.22);
  }

  h1 {
    margin-top: 32px;
    font-size: 84px;
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: -0.02em;
  }

  .pitch {
    margin-top: 28px;
    max-width: 560px;
    font-size: 34px;
    line-height: 1.25;
  }

  .license-and-platforms {
    margin-top: 20px;
    font-size: 24px;
    font-weight: 600;
  }

  .phone {
    position: absolute;
    right: 102px;
    top: 80px;
    width: 340px;
    padding: 14px;
    border-radius: 56px;
    background: #1C1B1F;
    box-shadow: 0 24px 60px rgba(13, 71, 161, 0.35);
  }

  .phone img {
    width: 100%;
    border-radius: 42px;
  }
</style>
</head>
<body>
  <div class="intro">
    <img class="icon" src="../app_logo.svg" alt="">
    <h1>OV-fiets<br>Beschikbaarheid</h1>
    <p class="pitch">See how many bikes are available before you get to the station.</p>
    <p class="license-and-platforms">Free and open source, for Android and iOS</p>
  </div>
  <div class="phone">
    <img src="detail-screen-iphone.png" alt="">
  </div>
</body>
</html>
